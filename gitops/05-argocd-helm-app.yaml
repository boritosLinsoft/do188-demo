apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    name: app-3tiers-argocd
    namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: 'https://github.com/boritosLinsoft/gitops.git'
    path: helm-chart
    targetRevision: main
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: demo-188
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
